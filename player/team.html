        /* Enhanced CSS for chapter markers */
        .vjs-chapter-marker {
            position: absolute;
            bottom: 0;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s ease-in-out;
        }

        /* Create vertical dividers for chapter markers */
        .vjs-chapter-marker::before,
        .vjs-chapter-marker::after {
            content: "";
            position: absolute;
            top: 0;
            height: 100%;
            width: 1px;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: 3;
            transition: background-color 0.2s ease;
        }

        .vjs-chapter-marker::before {
            left: 0;
        }

        .vjs-chapter-marker::after {
            right: 0;
        }

        /* Hover state */
        .vjs-chapter-marker:hover {
            background-color: #4E5FFD;
            opacity: 0.7;
            transform: scaleY(1.2);
        }

        .vjs-chapter-marker:hover::before,
        .vjs-chapter-marker:hover::after {
            background-color: white;
        }

        /* Chapter tooltip */
        .vjs-chapter-marker .chapter-tooltip {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 10px;
            line-height: 1.3;
            letter-spacing: 0.03em;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 5px 10px;
            background-color: rgba(28, 28, 28, 0.85);
            color: white;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
            z-index: 4;
            max-width: 200px;
            text-overflow: ellipsis;
            overflow: hidden;
            font-weight: normal;
            font-stretch: normal;
        }

        /* Show tooltip on hover */
        .vjs-chapter-marker:hover .chapter-tooltip {
            opacity: 1;
            visibility: visible;
        }

        /* Ensure hover works on mobile with touch events */
        @media (hover: none) {
            .vjs-chapter-marker:active {
                background-color: #4E5FFD;
                opacity: 0.7;
            }

            .vjs-chapter-marker:active .chapter-tooltip {
                opacity: 1;
                visibility: visible;
            }
        }

        /* Make sure the tooltip appears above the control bar */

                if (player.ended()) {
                    return;
                }

                emitPlayerEvent('videoPause', {
                    currentTime: player.currentTime(),
                    duration: player.duration() || 0,
                });
            });

            // Throttle timeupdate to roughly one message per second. VideoJS fires
            // 'timeupdate' ~4x/second which is too chatty for a postMessage stream.
            let lastEmittedSecond = -1;
            player.on('timeupdate', function () {
                if (player.paused() || player.seeking()) {
                    return;
                }

                const currentSecond = Math.floor(player.currentTime());
                if (currentSecond === lastEmittedSecond) {
                    return;
                }
                lastEmittedSecond = currentSecond;

                const duration = player.duration() || 0;

                // Plain playback position in seconds.
                emitPlayerEvent('videoTimeUpdate', {
                    currentTime: player.currentTime(),
                });

                // Progress as a percentage, emitted separately.
                emitPlayerEvent('videoProgress', {
                    currentTime: player.currentTime(),
                    duration: duration,
                    percent: duration ? (player.currentTime() / duration) * 100 : 0,
                });
            });

            // Reset the throttle when the user seeks so the next second emits.
            player.on('seeked', function () {
                lastEmittedSecond = -1;
                emitPlayerEvent('videoSeeked', {
                    currentTime: player.currentTime(),
                    duration: player.duration() || 0,
                });
            });

            player.on('volumechange', function () {
                emitPlayerEvent('videoVolumeChange', {
                    volume: player.volume(),
                    muted: player.muted(),
                });
            });

            player.on('fullscreenchange', function () {
                emitPlayerEvent('videoFullscreenChange', {
                    isFullscreen: player.isFullscreen(),
                });
            });

            player.on('error', function () {
                const error = player.error();
                emitPlayerEvent('videoError', {
                    code: error ? error.code : null,
                    message: error ? error.message : 'Unknown player error',
                });
            });

            // Show form on video end if configured
            
            // Analytics collection
            
            player.on('ended', () => {
                document.querySelector('.end-thumbnail')?.classList.add('visible')
                lastEmittedSecond = -1;
                emitPlayerEvent('videoEnded', {
                    duration: player.duration() || 0,
                })
            })

            player.on('loadedmetadata', function () { });
        })
    </script>
